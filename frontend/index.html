<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAT's Shift Manager</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #FFD700;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-top: 40px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #FFD700;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #FFD700;
            color: #121212;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e6c200;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
            color: #FFD700;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Add Staff Form -->
        <h2>Add New Staff</h2>
        <input type="text" id="staffId" placeholder="Staff ID (e.g. 003)">
        <input type="text" id="staffName" placeholder="Full Name">
        <input type="text" id="staffRole" placeholder="Role (e.g. Cloud Engineer)">
        <button onclick="addStaff()">Register Staff</button>
        <div id="staffStatus" class="status"></div>

        <!-- Log Shift Form -->
        <h2>Log Shift</h2>
        <input type="text" id="shiftStaffId" placeholder="Staff ID (e.g. 003)">
        <input type="date" id="shiftDate">
        <select id="shiftType">
            <option value="MORNING_SHIFT">Morning Shift</option>
            <option value="AFTERNOON_SHIFT">Afternoon Shift</option>
            <option value="NIGHT_SHIFT">Night Shift</option>
        </select>
        <input type="number" id="shiftHours" placeholder="Hours Worked">
        <button onclick="logShift()">Log Hours</button>
        <div id="shiftStatus" class="status"></div>
    </div>

    <script>
        const API_URL = 'https://o80f898rp7.execute-api.eu-west-2.amazonaws.com';

        async function addStaff() {
            const statusEl = document.getElementById('staffStatus');
            statusEl.innerText = "Registering...";
            
            const data = {
                id: document.getElementById('staffId').value,
                name: document.getElementById('staffName').value,
                skills: document.getElementById('staffRole').value
            };

            try {
                const response = await fetch(`${API_URL}/volunteers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                statusEl.innerText = result.message || "Success!";
            } catch (error) {
                statusEl.innerText = "Error registering staff.";
            }
        }

        async function logShift() {
            const statusEl = document.getElementById('shiftStatus');
            statusEl.innerText = "Logging shift...";
            
            const data = {
                vol_id: document.getElementById('shiftStaffId').value,
                date: document.getElementById('shiftDate').value,
                shift_id: document.getElementById('shiftType').value,
                hours: Number(document.getElementById('shiftHours').value)
            };

            try {
                const response = await fetch(`${API_URL}/shifts/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                statusEl.innerText = result.message || "Success!";
            } catch (error) {
                statusEl.innerText = "Error logging shift.";
            }
        }
    </script>
</body>
</html>

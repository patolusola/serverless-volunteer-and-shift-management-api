<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAT's Shift Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- login page -->
        <div id="loginView" class="card">
            <h2>Staff & Admin Portal Login</h2>
            <input type="text" id="loginStaffId" placeholder="Staff ID (e.g. 001 or ADMIN)">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Login</button>
            <div id="loginStatus" class="status"></div>
        </div>

        <!-- dashboard view -->
        <div id="dashboardView" class="hidden">
            <div class="user-header">
                <div>
                    <h2 id="welcomeTitle" style="color: #FFD700; margin:0;">Welcome</h2>
                    <p id="userRoleBadge" style="margin: 5px 0 0 0; color: #aaa; font-size: 13px;"></p>
                </div>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>

            <!-- add staff - admin access oonly -->
            <div id="adminSection" class="card hidden">
                <h2>Add New Staff Member</h2>
                <input type="text" id="staffId" placeholder="Staff ID (e.g. 003)">
                <input type="text" id="staffName" placeholder="Full Name">
                <input type="text" id="staffRole" placeholder="Role (e.g. Cloud Engineer, Admin)">
                <input type="password" id="staffPassword" placeholder="Initial Password">
                <button onclick="addStaff()">Register Staff</button>
                <div id="staffStatus" class="status"></div>
            </div>

            <!-- log shift form -->
            <div class="card">
                <h2>Log Shift</h2>
                <input type="text" id="shiftStaffId" placeholder="Staff ID">
                <input type="date" id="shiftDate">
                <select id="shiftType">
                    <option value="MORNING_SHIFT">Morning Shift</option>
                    <option value="AFTERNOON_SHIFT">Afternoon Shift</option>
                    <option value="NIGHT_SHIFT">Night Shift</option>
                </select>
                <input type="number" id="shiftHours" placeholder="Hours Worked">
                <select id="shiftStatusSelect">
                    <option value="SCHEDULED">Scheduled</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED" selected>Completed</option>
                </select>
                <button onclick="logShift()">Log Hours</button>
                <div id="shiftStatus" class="status"></div>
            </div>

            <!-- staff table (admin only access) -->
            <div id="rosterCard" class="card">
                <h2>Registered Staff Roster</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Staff ID</th>
                                <th>Full Name</th>
                                <th>Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody">
                            <tr><td colspan="4" class="empty-msg">Loading staff...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- shift table -->
            <div class="card">
                <h2 id="shiftsTableHeader">Logged Shifts</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Staff ID</th>
                                <th>Full Name</th>
                                <th>Role</th>
                                <th>Date</th>
                                <th>Shift</th>
                                <th>Hours</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="shiftsTableBody">
                            <tr><td colspan="7" class="empty-msg">Loading shifts...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>src="app.js"</script>

</body>
</html>
